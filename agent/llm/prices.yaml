# LLM price table used for per-call cost estimates (USD per million tokens).
#
# Prices are left null on purpose: the team fills each row from the provider's official pricing page and records
# the URL and the date it was read. A null price makes the cost "not defined" in every report; it is never
# replaced by a guess. `model: "*"` matches any model of that provider.
currency: USD
unit: per_million_tokens

prices:
  # All rows read on 2026-09-25 from the provider's official pricing page (standard tier, no batch, no cache).
  - provider: anthropic
    model: claude-haiku-4-5
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    source: https://platform.claude.com/docs/en/about-claude/pricing (read 2026-09-25)

  - provider: anthropic
    model: claude-haiku-4-5-20251001
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    source: https://platform.claude.com/docs/en/about-claude/pricing (read 2026-09-25)

  - provider: openai
    model: gpt-6-luna
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    source: https://developers.openai.com/api/docs/pricing (read 2026-09-25)

  - provider: openai
    model: gpt-4o-mini
    input_per_mtok: 0.15
    output_per_mtok: 0.60
    source: https://developers.openai.com/api/docs/pricing, "All models" table (read 2026-09-25)

  - provider: gemini
    model: gemini-2.5-flash-lite
    input_per_mtok: 0.10
    output_per_mtok: 0.40
    source: https://ai.google.dev/gemini-api/docs/pricing, paid tier (read 2026-09-25); the free tier is 0 with limits shown only in AI Studio

  - provider: groq
    model: TODO
    input_per_mtok: null
    output_per_mtok: null
    source: TODO official pricing URL and date read

  - provider: ollama
    model: "*"
    input_per_mtok: 0
    output_per_mtok: 0
    source: >-
      Local inference on the team's GPU has no per-token API charge. Hardware and energy are not counted and
      this is stated as a limitation wherever cost per case is reported.

  - provider: fake
    model: "*"
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    source: Deterministic test adapter; no provider is called, so there is no charge
