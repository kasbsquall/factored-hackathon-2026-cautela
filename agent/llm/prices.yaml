# LLM price table used for per-call cost estimates (USD per million tokens).
#
# Prices are left null on purpose: the team fills each row from the provider's official pricing page and records
# the URL and the date it was read. A null price makes the cost "not defined" in every report; it is never
# replaced by a guess. `model: "*"` matches any model of that provider.
currency: USD
unit: per_million_tokens

