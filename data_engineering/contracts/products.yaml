# Contract for products. Source: data dictionary lines 99-138.
# The extracted table is garbled: descriptions and constraints are printed below the column list.
# They were re-aligned by ordinal position; the counts match (17 columns, 17 descriptions).
table: products
kind: dimension
description: Active financial products of customers
source_system: Core Banking
partitioning: monthly_snapshot
partition_column: null
event_time_column: null
primary_key: [product_id]
dedupe_order: [last_updated]
expected_rows: 400000
layout: realigned
notes:
  - Descriptions and constraints re-aligned by ordinal position (17 columns, 17 descriptions).
columns:
  - {name: product_id, classification: none, type: VARCHAR(20), nullable: false, pk: true, severity: error, provenance: realigned, description: Unique product ID}
  - {name: customer_id, classification: pii_quasi, type: VARCHAR(20), nullable: false, fk: customers.customer_id, severity: error, provenance: realigned, description: Owner customer ID}
  - name: product_type
    classification: none
    type: VARCHAR(50)
    nullable: false
    allowed_values: [Checking Account, Savings Account, Credit Card, Debit Card, Personal Loan, Mortgage, Investment]
    enum_status: decoded
    observed_values: [Seguro]
    normalize: {Cuenta Corriente: Checking Account, Cuenta Ahorro: Savings Account, Tarjeta Crédito: Credit Card, Tarjeta Débito: Debit Card, Préstamo Personal: Personal Loan, Préstamo Hipotecario: Mortgage, Inversión: Investment}
    provenance: decoded
    check_severity: {bad_enum: warn}
    profile: true
    severity: error
    description: Product type
    note: >-
      The dictionary list is truncated ("Checking Account, Savings Account, Credit CaNrdO,TDNebUitLCL ard, Personal
      Loan, Mortgage, Investme"). The delivered data has 8 Spanish values. Seven map onto the decoded list, where
      "Investment" completes the truncated "Investme". "Seguro" (insurance, 2,049 rows) has no visible
      counterpart (it may sit in the truncated tail) and is kept as delivered. Enum violations are reported only.
  - {name: product_number, classification: sensitive_financial, type: VARCHAR(30), nullable: false, unique: true, severity: error, provenance: realigned, description: Account/card/policy number}
  - {name: currency, classification: none, type: VARCHAR(3), nullable: false, allowed_values: [MXN, COP, ARS, USD], enum_status: listed, severity: error, provenance: realigned, description: Currency}
  - {name: current_balance, classification: sensitive_financial, type: "DECIMAL(15,2)", nullable: false, severity: error, provenance: realigned, description: Current balance}
  - {name: credit_limit, classification: sensitive_financial, type: "DECIMAL(15,2)", nullable: true, severity: warn, provenance: realigned, description: Credit limit (for credit products)}
  - {name: interest_rate, classification: sensitive_financial, type: "DECIMAL(5,2)", nullable: true, severity: warn, provenance: realigned, description: Annual interest rate (%)}
  - {name: opening_date, classification: none, type: DATE, nullable: false, severity: error, provenance: realigned, description: Product opening date}
  - {name: expiration_date, classification: none, type: DATE, nullable: true, severity: warn, provenance: realigned, description: Expiration date (for term products)}
  - {name: opening_branch_id, classification: none, type: VARCHAR(20), nullable: false, fk: branches.branch_id, severity: error, provenance: realigned, description: Branch where opened}
  - {name: product_status, classification: none, type: VARCHAR(20), nullable: false, allowed_values: [Active, Blocked, Closed, Suspended], enum_status: listed, severity: error, provenance: realigned, description: Product status}
  - {name: opening_channel, classification: none, type: VARCHAR(30), nullable: false, allowed_values: [Branch, Web, App, Call Center], enum_status: listed, severity: error, provenance: realigned, description: Opening channel}
  - {name: has_linked_app, classification: none, type: BOOLEAN, nullable: false, severity: error, provenance: realigned, description: Product linked to mobile app}
  - {name: days_past_due, classification: sensitive_financial, type: INTEGER, nullable: true, severity: warn, provenance: realigned, description: Days past due (for credits)}
  - {name: last_transaction_date, classification: none, type: TIMESTAMP, nullable: true, severity: warn, provenance: realigned, description: Last transaction date}
  - {name: last_updated, classification: none, type: TIMESTAMP, nullable: false, severity: error, provenance: realigned, description: Last record update}
