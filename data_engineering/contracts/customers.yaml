# Contract for customers. Source: organizer data dictionary v1.0.0 (data-dictionary.txt, lines 39-97).
table: customers
kind: dimension
description: Bank customer dimension table
source_system: Core Banking
partitioning: monthly_snapshot
partition_column: null
event_time_column: null
primary_key: [customer_id]
dedupe_order: [last_updated]
expected_rows: 150000
layout: clean
notes:
  - Snapshot tables have no partition column in the dictionary; the snapshot date comes from the file path order.
columns:
  - {name: customer_id, classification: pii_quasi, type: VARCHAR(20), nullable: false, pk: true, severity: error, description: Unique customer ID}
  - {name: document_number, classification: pii_direct, type: VARCHAR(20), nullable: false, unique: true, severity: error, description: Identity document number}
  - name: document_type
    classification: none
    type: VARCHAR(10)
    nullable: false
    allowed_values: [DNI, CURP, CC, CE, Passport]
    enum_status: listed
    normalize: {Pasaporte: Passport}
    profile: true
    severity: error
    description: Document type
    note: Delivered "Pasaporte" (15,062 rows) is the Spanish form of the documented "Passport". CURP is never observed.
  - {name: first_name, classification: pii_direct, type: VARCHAR(100), nullable: false, severity: error, description: Customer first name (in Spanish)}
  - {name: last_name, classification: pii_direct, type: VARCHAR(100), nullable: false, severity: error, description: Customer last name (in Spanish)}
  - {name: date_of_birth, classification: pii_quasi, type: DATE, nullable: false, severity: error, description: Date of birth}
  - {name: gender, classification: pii_quasi, type: VARCHAR(1), nullable: true, allowed_values: [M, F, O], enum_status: listed, severity: warn, description: Gender}
  - {name: email, classification: pii_direct, type: VARCHAR(100), nullable: true, severity: warn, description: Email address}
  - {name: mobile_phone, classification: pii_direct, type: VARCHAR(20), nullable: true, severity: warn, description: Mobile phone number}
  - {name: landline_phone, classification: pii_direct, type: VARCHAR(20), nullable: true, severity: warn, description: Landline phone number}
  - {name: address, classification: pii_direct, type: VARCHAR(200), nullable: true, severity: warn, description: Full address (in Spanish)}
  - {name: city, classification: pii_quasi, type: VARCHAR(100), nullable: false, severity: error, description: City of residence}
  - {name: state, classification: pii_quasi, type: VARCHAR(100), nullable: false, severity: error, description: State/Province}
  - name: country
    classification: none
    type: VARCHAR(50)
    nullable: false
    allowed_values: [Mexico, Colombia, Argentina]
    enum_status: listed
    normalize: {México: Mexico}
    profile: true
    severity: error
    description: Country
    note: Delivered "México" (74,907 rows) is the accented form of the documented "Mexico".
  - {name: postal_code, classification: pii_quasi, type: VARCHAR(10), nullable: true, severity: warn, description: Postal code}
  - name: detected_accent
    classification: pii_quasi
    type: VARCHAR(50)
    nullable: true
    allowed_values: [mexican, colombian, argentine, neutral]
    enum_status: decoded
    provenance: decoded
    profile: true
    severity: warn
    description: Spanish accent detected
    note: >-
      Extracted text reads "mexican, colombian, argentine, ne-utral": the constraint column "-" was merged into
      the last value. Decoded as "neutral" and nullable. Reported only until the real data confirms it.
  - {name: segment, classification: none, type: VARCHAR(50), nullable: false, allowed_values: [Premium, Plus, Basic, Student], enum_status: listed, severity: error, description: Customer segment}
  - {name: credit_score, classification: sensitive_financial, type: INTEGER, nullable: true, min: 300, max: 850, severity: error, description: Credit score (300-850)}
  - {name: estimated_monthly_income, classification: sensitive_financial, type: "DECIMAL(12,2)", nullable: true, severity: warn, description: Estimated monthly income in local currency}
  - {name: occupation, classification: pii_quasi, type: VARCHAR(100), nullable: true, severity: warn, description: Customer occupation}
  - {name: marital_status, classification: pii_quasi, type: VARCHAR(20), nullable: true, profile: true, severity: warn, description: Marital status (no values listed)}
  - {name: education_level, classification: pii_quasi, type: VARCHAR(50), nullable: true, profile: true, severity: warn, description: Education level (no values listed)}
  - {name: registration_date, classification: none, type: TIMESTAMP, nullable: false, severity: error, description: Registration date as customer}
  - name: registration_branch_id
    classification: none
    type: VARCHAR(20)
    nullable: false
    fk: branches.branch_id
    check_severity: {orphan_fk: warn}
    severity: error
    description: Branch ID where registered
    note: >-
      In the delivered data 149,995 of 150,000 values do not exist in branches (every customer has a distinct
      branch id and only 5 match). The relationship is unusable as delivered, so orphans are reported and the
      customer rows are kept. products.opening_branch_id, by contrast, resolves for all 400,000 rows.
  - {name: customer_status, classification: none, type: VARCHAR(20), nullable: false, allowed_values: [Active, Inactive, Suspended, Closed], enum_status: listed, severity: error, description: Customer status}
  - {name: last_updated, classification: none, type: TIMESTAMP, nullable: false, severity: error, description: Last record update}
  - {name: accepts_marketing, classification: none, type: BOOLEAN, nullable: false, severity: error, description: Accepts marketing communications}
