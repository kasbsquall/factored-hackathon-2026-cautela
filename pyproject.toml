[project]
name = "cautela"
version = "0.1.0"
description = "Cautela: transaction-dispute intake service. Data engineering foundation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "jsonschema>=4.22",
    "scikit-learn>=1.9.1",
    "mlflow>=3.16.1",
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
