[project]
name = "cautela"
version = "0.1.0"
description = "Cautela: transaction-dispute intake service. Data engineering foundation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
